# The mcp-servers group's standard image pipeline (as in mcp-sap-notes, itglue-mcp-server and
# studio-mcp-server), with the test suite run first: every push to main builds the image, pushes it to
# this project's container registry as :<short sha> and :latest, and a git tag publishes :<tag>.
image: docker:20

services:
- docker:20.10.16-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

stages:
- test
- build
- release

Tests:
  stage: test
  image: python:3.14.8-slim
  services: []
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: pip
    paths:
    - .cache/pip
  rules:
  - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    when: always
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: always
  - if: $CI_COMMIT_TAG
    when: always
  script:
  - pip install -r requirements.txt
  - python -m pytest tests -q

.image_template:
  image: docker:20
  services:
  - docker:20.10.16-dind
  before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

Build:
  extends: .image_template
  stage: build
  rules:
  - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    when: always
  - if: $CI_COMMIT_TAG
    when: always
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: manual
    allow_failure: true
  script:
  - docker pull $CI_REGISTRY_IMAGE:latest || true
  - >
    docker build --pull --cache-from $CI_REGISTRY_IMAGE:latest
    --label "com.syntax.genai.image.title=$CI_PROJECT_TITLE"
    --label "com.syntax.genai.image.url=$CI_PROJECT_URL"
    --label "com.syntax.genai.image.created=$CI_JOB_STARTED_AT"
    --label "com.syntax.genai.image.revision=$CI_COMMIT_SHA"
    --label "com.syntax.genai.image.version=$CI_COMMIT_REF_NAME"
    --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
  - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

release latest:
  extends: .image_template
  variables:
    GIT_STRATEGY: none
  stage: release
  rules:
  - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    when: always
  script:
  - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
  - docker push $CI_REGISTRY_IMAGE:latest

release tag:
  extends: .image_template
  variables:
    GIT_STRATEGY: none
  stage: release
  rules:
  - if: $CI_COMMIT_TAG
    when: always
  script:
  - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
